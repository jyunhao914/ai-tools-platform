<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT 專案-簡報製作指令</title>
<meta name="description" content="挑一種風格、複製專案指令貼進 ChatGPT 專案，逐頁連續生成整套投影片圖片。15 種簡報視覺風格指令庫。">
<meta property="og:title" content="ChatGPT 專案-簡報製作指令">
<meta property="og:description" content="挑一種風格、複製專案指令貼進 ChatGPT 專案，逐頁連續生成整套投影片圖片。15 種簡報視覺風格指令庫。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jyunhao914.github.io/ai-tools-platform/gpt-slides/">
<meta property="og:image" content="https://jyunhao914.github.io/ai-tools-platform/gpt-slides/thumbs/s01.jpg">
<link rel="icon" href="../favicon.ico">
<style>
:root{
  --bg:#22252f;--bg2:#292d39;--bg3:#313644;
  --card:rgba(255,255,255,0.045);--card-h:rgba(255,255,255,0.075);
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);
  --text:#ededf0;--text2:#8b8b95;--text3:#5c5c66;
  --accent:#6366f1;--accent-soft:rgba(99,102,241,0.12);
  --r:12px;--r2:18px;
}
[data-theme="light"]{
  --bg:#fafafa;--bg2:#ffffff;--bg3:#f4f4f5;
  --card:rgba(0,0,0,0.03);--card-h:rgba(0,0,0,0.06);
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.12);
  --text:#18181b;--text2:#52525b;--text3:#a1a1aa;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
.nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:60px;background:rgba(31,34,44,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
[data-theme="light"] .nav{background:rgba(250,250,250,0.9);border-bottom-color:rgba(0,0,0,0.08)}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;user-select:none}
.nav-logo .mark{width:32px;height:32px;border-radius:8px;object-fit:cover;display:block;flex-shrink:0}
.nav-right{display:flex;align-items:center;gap:8px}
.back{font-size:13px;color:var(--text2);border:1px solid var(--border2);border-radius:8px;padding:7px 14px;white-space:nowrap;transition:.2s}
.back:hover{color:var(--accent);border-color:var(--accent)}
.theme-toggle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;background:var(--card);border:1px solid var(--border);transition:all .2s;flex-shrink:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 70px}
.feature{margin:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r2)}
.feature summary{list-style:none;cursor:pointer;padding:15px 20px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
.feature summary::-webkit-details-marker{display:none}
.feature summary .arrow{margin-left:auto;color:var(--text3);transition:transform .2s;font-size:12px}
.feature[open] summary .arrow{transform:rotate(180deg)}
.feature ul{padding:0 22px 16px 40px;color:var(--text2);font-size:13.5px;display:grid;gap:6px}
.sec-title{margin:0 0 16px;font-size:17px;font-weight:700}
.module{margin-top:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{background:var(--card-h);border-color:var(--border2);transform:translateY(-3px)}
.thumb{aspect-ratio:3/2;background:var(--bg3);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.scene{font-size:15px;font-weight:700}
.name{font-size:12px;color:var(--text3)}
.btn-copy{margin-top:11px;width:100%;padding:10px 14px;border-radius:9px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.btn-copy:hover{filter:brightness(1.12)}
.btn-copy.ok{background:#22c55e}
.article-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:22px 26px;font-size:14.5px;color:var(--text)}
.article-box p{margin:0 0 12px}
.article-box p:last-child{margin-bottom:0}
.article-box img{border-radius:10px;margin:10px 0}
.article-box a{color:var(--accent)}
.article-box h3{margin:16px 0 8px;font-size:16px}
.article-box ul,.article-box ol{padding-left:22px;margin:0 0 12px}
.carousel{position:relative;border-radius:var(--r2);overflow:hidden;background:var(--bg3);border:1px solid var(--border)}
.carousel .track{display:flex;transition:transform .35s ease}
.carousel .track img{width:100%;flex-shrink:0;object-fit:contain;max-height:560px;background:var(--bg3)}
.carousel .cbtn{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.45);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;opacity:.8}
.carousel .cbtn:hover{opacity:1}
.carousel .prev{left:12px}
.carousel .next{right:12px}
.carousel .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.carousel .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.45);cursor:pointer}
.carousel .dots i.on{background:#fff}
.carousel-text{margin-top:14px}
.video-wrap{position:relative;width:100%;padding-bottom:56.25%;border-radius:var(--r2);overflow:hidden;background:#000;border:1px solid var(--border)}
.video-wrap iframe,.video-wrap video{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-text{margin-top:14px}
.faq-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px}
.faq-item summary{list-style:none;cursor:pointer;padding:13px 18px;font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:center}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary .arrow{margin-left:auto;color:var(--text3);transition:transform .2s;font-size:12px}
.faq-item[open] summary .arrow{transform:rotate(180deg)}
.faq-item .fa{padding:0 18px 14px;color:var(--text2);font-size:13.5px}
.dl-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:10px}
.dl-row .dn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-row a{flex-shrink:0;padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600}
.dl-row a:hover{filter:brightness(1.12)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row a{padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;transition:.2s}
.btn-row a.pri{background:var(--accent);color:#fff}
.btn-row a.pri:hover{filter:brightness(1.12)}
.btn-row a.line{border:1px solid var(--border2);color:var(--text)}
.btn-row a.line:hover{border-color:var(--accent);color:var(--accent)}
.twocol{display:flex;gap:22px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:20px}
.twocol img{width:44%;border-radius:10px;flex-shrink:0}
.twocol .tc-text{flex:1;font-size:14.5px}
.twocol.img-right{flex-direction:row-reverse}
@media(max-width:700px){.twocol,.twocol.img-right{flex-direction:column}.twocol img{width:100%}}
.embed-wrap{border-radius:var(--r2);overflow:hidden;border:1px solid var(--border);background:var(--bg3)}
.embed-wrap iframe{display:block;width:100%;border:0}
.footer{text-align:center;padding:32px 24px;color:var(--text3);font-size:13px;border-top:1px solid var(--border)}
.footer a{color:var(--text2)}
.footer a:hover{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:10px 22px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo" id="logo"><img class="mark" src="../assets/logo.png" alt="logo"><span id="siteTitle">載入中…</span></div>
  <div class="nav-right">
    <a class="back" id="backLink" href="https://jyunhao914.github.io/ai-tools-platform/">← 回 AI 工具平台</a>
    <button class="theme-toggle" id="themeToggle" title="切換主題">🌙</button>
  </div>
</nav>

<div class="wrap">
  <div id="modules"></div>
</div>

<footer class="footer" id="siteFooter"></footer>

<div class="toast" id="toast">已複製指令</div>

<script>
/* 主題：與平台共用 localStorage 'theme' */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeToggle').textContent=t==='dark'?'☀️':'🌙';
  lsSet('theme',t);
}
applyTheme(lsGet('theme')||'dark');
document.getElementById('themeToggle').onclick=function(){
  applyTheme((lsGet('theme')||'dark')==='dark'?'light':'dark');
};

/* 後台入口：?admin、Alt+A / Ctrl+Shift+A、Logo 快點 5 下 */
var HUB=location.pathname.replace(/\/index\.html$/,'').split('/').filter(Boolean).pop();
if(location.search.indexOf('admin')>=0)location.href='../hub-admin.html?hub='+HUB;
document.addEventListener('keydown',function(e){
  if(((e.ctrlKey&&!e.metaKey)&&e.shiftKey&&(e.key==='A'||e.key==='a'))||(e.altKey&&(e.key==='A'||e.key==='a'))){
    e.preventDefault();location.href='../hub-admin.html?hub='+HUB;
  }
});
(function(){
  var n=0,t=null;
  document.getElementById('logo').addEventListener('click',function(){
    n++;clearTimeout(t);
    if(n>=5){n=0;location.href='../hub-admin.html?hub='+HUB}
    else t=setTimeout(function(){n=0},1500);
  });
})();

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show')},1800)}
function copyText(txt,btn){
  function done(){toast('已複製指令');if(btn){var o=btn.innerHTML;btn.classList.add('ok');btn.innerHTML='✓ 已複製';setTimeout(function(){btn.classList.remove('ok');btn.innerHTML=o},1600)}}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done)}
  else{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done()}
}

/* ── 模組渲染 ── */
function renderFaqModule(host,m){
  (m.items||[]).forEach(function(it){
    var d=document.createElement('details');d.className='faq-item';
    var sm=document.createElement('summary');
    sm.innerHTML='<span></span><span class="arrow">▼</span>';
    sm.querySelector('span').textContent=it.q||'';
    d.appendChild(sm);
    var a=document.createElement('div');a.className='fa';
    a.innerHTML=/<\w+[^>]*>/.test(it.a||'')?it.a:esc(it.a||'').replace(/\n/g,'<br>');
    d.appendChild(a);
    host.appendChild(d);
  });
}
function renderFilesModule(host,m){
  (m.files||[]).forEach(function(f){
    var row=document.createElement('div');row.className='dl-row';
    row.innerHTML='<span style="font-size:20px">📎</span><span class="dn"></span>'
      +'<a href="'+esc(f.url||'')+'" '+(/^https?:/.test(f.url||'')?'target="_blank" rel="noopener"':'download')+'>⬇ 下載</a>';
    row.querySelector('.dn').textContent=f.name||f.url;
    host.appendChild(row);
  });
}
function renderButtonsModule(host,m){
  var row=document.createElement('div');row.className='btn-row';
  (m.buttons||[]).forEach(function(b){
    var a=document.createElement('a');
    a.className=b.style==='line'?'line':'pri';
    a.href=b.url||'#';
    if(/^https?:/.test(b.url||'')){a.target='_blank';a.rel='noopener'}
    a.textContent=b.label||'按鈕';
    row.appendChild(a);
  });
  host.appendChild(row);
}
function renderTwocolModule(host,m){
  var d=document.createElement('div');d.className='twocol'+(m.side==='right'?' img-right':'');
  if(m.image){var im=document.createElement('img');im.loading='lazy';im.src=m.image;d.appendChild(im)}
  var tx=document.createElement('div');tx.className='tc-text';tx.innerHTML=m.html||'';
  d.appendChild(tx);
  host.appendChild(d);
}
function renderEmbedModule(host,m){
  if(!m.url)return;
  var w=document.createElement('div');w.className='embed-wrap';
  var f=document.createElement('iframe');
  f.src=m.url;f.height=parseInt(m.height,10)||480;f.loading='lazy';
  f.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-forms');
  w.appendChild(f);
  host.appendChild(w);
}
function applyDisplay(img,s){
  if(!img)return;
  var fit=s.fit||'cover';
  var z=(parseInt(s.zoom,10)||100)/100;
  /* 縮小（<100%）時裁滿模式改為完整顯示再縮，才能露出整張圖 */
  var effFit=(fit==='cover'&&z<1)?'contain':fit;
  img.style.objectFit=effFit;
  img.style.objectPosition=s.pos||'center';
  img.style.transform=z!==1?'scale('+z+')':'';
  var st=img.parentElement;
  if(st)st.style.background=(effFit==='contain'&&s.bg)?s.bg:'';
}
function renderCardsModule(host,items){
  var g=document.createElement('div');g.className='grid';
  (items||[]).forEach(function(s){
    var el=document.createElement('div');el.className='card';
    el.innerHTML='<div class="thumb">'+(s.thumb?'<img loading="lazy" src="'+esc(s.thumb)+'" alt="'+esc(s.scene)+'">':'')+'</div>'
      +'<div class="info"><div class="scene">'+esc(s.scene)+'</div>'
      +(s.name?'<div class="name">'+esc(s.name)+'</div>':'')
      +(s.prompt?'<button class="btn-copy">📋 複製指令</button>':'')
      +(s.link?'<a class="btn-copy" href="'+esc(s.link)+'" target="_blank" rel="noopener">↗ '+esc(s.linkLabel||'開啟連結')+'</a>':'')
      +'</div>';
    var im=el.querySelector('.thumb img');
    if(im)applyDisplay(im,s);
    var b=el.querySelector('button.btn-copy');
    if(b)b.addEventListener('click',function(){copyText(s.prompt,this)});
    g.appendChild(el);
  });
  host.appendChild(g);
}
function renderAccordionModule(host,m){
  var d=document.createElement('details');d.className='feature';
  var sm=document.createElement('summary');
  sm.innerHTML='<span></span><span class="arrow">▼</span>';
  sm.querySelector('span').textContent=m.title||'說明';
  d.appendChild(sm);
  var ul=document.createElement('ul');
  (m.items||[]).forEach(function(f){var li=document.createElement('li');li.textContent=f;ul.appendChild(li)});
  d.appendChild(ul);
  host.appendChild(d);
}
function renderArticleModule(host,m){
  var d=document.createElement('div');d.className='article-box';
  d.innerHTML=m.html||'';
  host.appendChild(d);
}
function renderCarouselModule(host,m){
  var imgs=m.images||[];
  if(imgs.length){
    var c=document.createElement('div');c.className='carousel';
    var track=document.createElement('div');track.className='track';
    imgs.forEach(function(u){var im=document.createElement('img');im.loading='lazy';im.src=u;track.appendChild(im)});
    c.appendChild(track);
    var idx=0;
    var dots=document.createElement('div');dots.className='dots';
    function go(i){
      idx=(i+imgs.length)%imgs.length;
      track.style.transform='translateX(-'+(idx*100)+'%)';
      dots.querySelectorAll('i').forEach(function(d,k){d.classList.toggle('on',k===idx)});
    }
    imgs.forEach(function(_,k){var i=document.createElement('i');if(k===0)i.className='on';i.onclick=function(){go(k)};dots.appendChild(i)});
    if(imgs.length>1){
      var pv=document.createElement('button');pv.className='cbtn prev';pv.innerHTML='‹';pv.onclick=function(){go(idx-1)};
      var nx=document.createElement('button');nx.className='cbtn next';nx.innerHTML='›';nx.onclick=function(){go(idx+1)};
      c.appendChild(pv);c.appendChild(nx);c.appendChild(dots);
    }
    host.appendChild(c);
  }
  if(m.html){var t=document.createElement('div');t.className='article-box carousel-text';t.innerHTML=m.html;host.appendChild(t)}
}
function toEmbed(u){
  if(!u)return '';
  var m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/);
  if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1];
  if(/youtube\.com\/embed\/|youtube-nocookie\.com\/embed\//.test(u))return u;
  return '';
}
function renderVideoModule(host,m){
  if(m.video){
    var w=document.createElement('div');w.className='video-wrap';
    var emb=toEmbed(m.video);
    if(emb){var f=document.createElement('iframe');f.src=emb;f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';f.allowFullscreen=true;w.appendChild(f)}
    else{var v=document.createElement('video');v.src=m.video;v.controls=true;w.appendChild(v)}
    host.appendChild(w);
  }
  if(m.html){var t=document.createElement('div');t.className='article-box video-text';t.innerHTML=m.html;host.appendChild(t)}
}

var _isPreview=location.search.indexOf('preview=1')>=0;
function loadData(){
  if(_isPreview){
    try{
      var d=localStorage.getItem('hub_preview_'+HUB);
      if(d){
        var bar=document.createElement('div');
        bar.style.cssText='background:rgba(251,191,36,.14);color:#fbbf24;padding:8px 20px;font-size:13px;text-align:center';
        bar.textContent='👁 預覽模式：這是後台尚未發佈的草稿內容';
        document.body.insertBefore(bar,document.body.firstChild);
        return Promise.resolve(JSON.parse(d));
      }
    }catch(e){}
  }
  return fetch('data.json?t='+Date.now()).then(function(r){return r.json()});
}
var GAS_API='https://script.google.com/macros/s/AKfycbx6qfQFbhAwiqA4AdRisH2HuZDw8iLQEEw-pxraTYCCoMInj0O9cpygBSsB6ii32j21/exec';
function trackVisit(title){
  if(_isPreview)return;
  try{
    if(sessionStorage.getItem('hubv_'+HUB))return;
    sessionStorage.setItem('hubv_'+HUB,'1');
  }catch(e){}
  fetch(GAS_API+'?action=recordClick&id=hub:'+encodeURIComponent(HUB)+'&title='+encodeURIComponent(title||HUB),{mode:'no-cors'}).catch(function(){});
}
loadData().then(function(data){
  var site=data.site||{};
  document.getElementById('siteTitle').textContent=site.title||'工具頁';
  if(!_isPreview)document.title=site.title||'工具頁';
  if(site.desc){
    var md=document.querySelector('meta[name=description]')||document.head.appendChild(Object.assign(document.createElement('meta'),{name:'description'}));
    md.content=site.desc;
  }
  if(site.backUrl)document.getElementById('backLink').href=site.backUrl;
  if(site.backLabel)document.getElementById('backLink').textContent='← '+site.backLabel;
  document.getElementById('siteFooter').textContent=site.footer||'';
  trackVisit(site.title);

  var mods=data.modules;
  if(site.featureTitle&&site.features&&site.features.length&&!(mods||[]).some(function(m){return m.type==='accordion'})){
    mods=[{type:'accordion',title:site.featureTitle,items:site.features}].concat(mods||[]);
  }
  if((!mods||!mods.length)&&data.styles&&data.styles.length){
    mods=[{type:'cards',title:site.secTitle||'選擇風格，複製專案指令',items:data.styles}];
  }
  var host=document.getElementById('modules');
  (mods||[]).forEach(function(m){
    var sec=document.createElement('section');sec.className='module';
    if(m.title&&m.type!=='accordion'){var h=document.createElement('div');h.className='sec-title';h.textContent=m.title;sec.appendChild(h)}
    if(m.type==='accordion')renderAccordionModule(sec,m);
    else if(m.type==='cards')renderCardsModule(sec,m.items);
    else if(m.type==='article')renderArticleModule(sec,m);
    else if(m.type==='carousel')renderCarouselModule(sec,m);
    else if(m.type==='video')renderVideoModule(sec,m);
    else if(m.type==='faq')renderFaqModule(sec,m);
    else if(m.type==='files')renderFilesModule(sec,m);
    else if(m.type==='buttons')renderButtonsModule(sec,m);
    else if(m.type==='twocol')renderTwocolModule(sec,m);
    else if(m.type==='embed')renderEmbedModule(sec,m);
    host.appendChild(sec);
  });
}).catch(function(){document.getElementById('modules').innerHTML='<p style="color:var(--text3);margin-top:30px">資料載入失敗，請稍後再試。</p>'});
</script>

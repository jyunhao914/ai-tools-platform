  <title>映光街區・互動城鎮</title>
  <style>
    html,body,#scene{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
    canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
    canvas:active{cursor:grabbing}canvas:focus-visible{outline:2px solid #f4c891;outline-offset:-3px}
  </style>

<body>
  <div id="scene"></div>
<dialog id="community-board" aria-labelledby="board-title">
  <header class="board-heading"><div><h2 id="board-title">工作室留言牆</h2><p>可以分享工具用法、提問，或留下想看的教學。</p></div><button type="button" id="board-close" autofocus>回到室內 ×</button></header>
  <div class="board-columns"><div><button type="button" id="board-refresh">更新留言</button><ol id="board-entries" aria-label="最新留言"></ol><p id="board-empty" role="status">載入留言中…</p></div>
  <form id="board-form"><h3>貼一張便條</h3><label for="board-name">暱稱（選填）</label><input maxlength="24" id="board-name" placeholder="訪客" autocomplete="off">
  <label for="board-body">留言內容</label><textarea id="board-body" maxlength="500" rows="4" required placeholder="想和大家分享什麼？"></textarea>
  <div class="board-send"><small>留言會公開顯示</small><button type="submit">貼上留言牆</button></div><p id="board-status" role="status"></p></form></div>
</dialog>

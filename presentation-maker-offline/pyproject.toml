[project]
name = "presentation-maker-offline"
version = "0.3.1"
description = "Offline-first presentation workflow core"
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0.0", "python-docx>=1.1.0", "pypdf>=5.0.0", "Pillow>=10.0.0", "PySide6-Essentials>=6.8,<7"]

[project.scripts]
presentation-maker-offline = "presentation_maker_offline.cli:main"
presentation-maker-offline-app = "presentation_maker_offline.qt_ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

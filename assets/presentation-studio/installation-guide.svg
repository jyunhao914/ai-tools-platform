<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc"><title id="title">安裝與首次使用，跟著四步走</title><desc id="desc">Mac／Windows 共用雲端外掛包｜以下為步驟示意圖</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#0f766e" stroke-width="1.4"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><rect x="0" y="0" width="960" height="1200" rx="24" fill="#f2f7fb" stroke="#e2e8f0"/><text x="44" y="51" font-size="17" fill="#0f766e" font-weight="700">PRESENTATION STUDIO</text><text x="44" y="103" font-size="38" fill="#123b64" font-weight="700">安裝與首次使用，跟著四步走</text><text x="44" y="145" font-size="23" fill="#334155" font-weight="400">Mac／Windows 共用雲端外掛包｜以下為步驟示意圖</text><rect x="44" y="184" width="872" height="176" rx="20" fill="#fff" stroke="#cbdde6"/><g transform="translate(76 234)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="0" width="64" height="82" rx="8"/><path d="M42 5v30M37 12h10M37 22h10M37 32h10"/><text x="21" y="65" font-size="24" fill="#0f766e" font-weight="700">ZIP</text></g><text x="190" y="221" font-size="19" fill="#0f766e" font-weight="700">01</text><text x="190" y="260" font-size="30" fill="#123b64" font-weight="700">下載外掛 ZIP</text><text x="190" y="300" font-size="24" fill="#334155" font-weight="400">使用本頁「下載外掛 ZIP」按鈕。</text><text x="190" y="334" font-size="24" fill="#334155" font-weight="400">保留 ZIP 原檔，供 ChatGPT 上傳匯入。</text><path d="M480 363 v32" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="398" width="872" height="176" rx="20" fill="#fff" stroke="#cbdde6"/><g transform="translate(76 448)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="3" width="88" height="75" rx="8"/><path d="M0 23h88M13 13h2M23 13h2M33 13h2M44 64V34M32 46l12-12 12 12"/></g><text x="190" y="435" font-size="19" fill="#0f766e" font-weight="700">02</text><text x="190" y="474" font-size="30" fill="#123b64" font-weight="700">開啟 ChatGPT 外掛程式</text><text x="190" y="514" font-size="24" fill="#334155" font-weight="400">登入自己的帳號，進入外掛程式頁面。</text><text x="190" y="548" font-size="24" fill="#334155" font-weight="400">使用帳號提供的上傳入口，選取剛下載的 ZIP。</text><path d="M480 577 v32" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="612" width="872" height="176" rx="20" fill="#fff" stroke="#cbdde6"/><g transform="translate(76 662)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M19 61C-4 61-4 30 17 28C18 2 59-1 65 25C94 22 99 61 73 61Z"/><path d="M31 44l10 10 19-21"/></g><text x="190" y="649" font-size="19" fill="#0f766e" font-weight="700">03</text><text x="190" y="688" font-size="30" fill="#123b64" font-weight="700">連接自己的 Google Drive</text><text x="190" y="728" font-size="24" fill="#334155" font-weight="400">開新對話並選取「Presentation Studio」。</text><text x="190" y="762" font-size="24" fill="#334155" font-weight="400">要求初次設定，依畫面登入 Google 並授權。</text><path d="M480 791 v32" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="826" width="872" height="176" rx="20" fill="#fff" stroke="#cbdde6"/><g transform="translate(76 876)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5h68a8 8 0 018 8v44a8 8 0 01-8 8H33L11 80V65a8 8 0 01-8-8V13a8 8 0 017-8Z"/><path d="M20 25h48M20 42h33"/></g><text x="190" y="863" font-size="19" fill="#0f766e" font-weight="700">04</text><text x="190" y="902" font-size="30" fill="#123b64" font-weight="700">確認設定，開始製作</text><text x="190" y="942" font-size="24" fill="#334155" font-weight="400">確認已建立風格庫與製作紀錄位置。</text><text x="190" y="976" font-size="24" fill="#334155" font-weight="400">貼上大綱或上傳來源，選擇形式、風格及內容處理。</text><rect x="44" y="1050" width="872" height="112" rx="20" fill="#eaf2fb" stroke="#c4d8ed"/><text x="67" y="1089" font-size="25" fill="#123b64" font-weight="700">看不到上傳入口？請先確認帳號是否開放此功能。</text><text x="67" y="1131" font-size="24" fill="#334155" font-weight="400">不需另外安裝 PowerPoint、LibreOffice、Python 或 OCR。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1130" role="img" aria-labelledby="title desc"><title id="title">先有可編輯母檔，再升級視覺</title><desc id="desc">建議製作順序｜每次修改，都保留能再編輯的版本</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#0f766e" stroke-width="1.4"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><rect x="0" y="0" width="960" height="1130" rx="24" fill="#f2f7fb" stroke="#e2e8f0"/><text x="44" y="51" font-size="17" fill="#0f766e" font-weight="700">PRESENTATION STUDIO</text><text x="44" y="103" font-size="38" fill="#123b64" font-weight="700">先有可編輯母檔，再升級視覺</text><text x="44" y="145" font-size="23" fill="#334155" font-weight="400">建議製作順序｜每次修改，都保留能再編輯的版本</text><rect x="44" y="184" width="872" height="180" rx="20" fill="#fff" stroke="#cbdde6"/><g transform="translate(76 233)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="0" width="65" height="82" rx="8"/><path d="M23 24h34M23 41h34M23 58h23"/></g><text x="190" y="222" font-size="19" fill="#0f766e" font-weight="700">01</text><text x="190" y="261" font-size="31" fill="#123b64" font-weight="700">整理並確認大綱</text><text x="190" y="302" font-size="24" fill="#334155" font-weight="400">提供文字、PPTX 或簡報 PDF</text><text x="190" y="337" font-size="24" fill="#334155" font-weight="400">確認頁數、內容保留方式與風格</text><path d="M480 368 v32" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="403" width="872" height="180" rx="20" fill="#fff" stroke="#cbdde6"/><g transform="translate(76 452)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="4" width="85" height="62" rx="8"/><path d="M14 19h36M14 34h25M14 48h25M43 67v15M26 82h34"/><rect x="53" y="31" width="20" height="23" rx="3"/></g><text x="190" y="441" font-size="19" fill="#0f766e" font-weight="700">02</text><text x="190" y="480" font-size="31" fill="#123b64" font-weight="700">製作可編輯簡報</text><text x="190" y="521" font-size="24" fill="#334155" font-weight="400">文字與版面可修改，配圖獨立保存</text><text x="190" y="556" font-size="24" fill="#334155" font-weight="400">流程、比較、系列圖可同頁安排多張 PNG</text><path d="M480 587 v32" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="622" width="872" height="180" rx="20" fill="#fff" stroke="#cbdde6"/><g transform="translate(76 671)" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="4" width="85" height="68" rx="8"/><circle cx="63" cy="23" r="7"/><path d="M9 61l20-25 19 18 12-12 16 19"/></g><text x="190" y="660" font-size="19" fill="#0f766e" font-weight="700">03</text><text x="190" y="699" font-size="31" fill="#123b64" font-weight="700">視需要轉成圖像式簡報</text><text x="190" y="740" font-size="24" fill="#334155" font-weight="400">內容定稿後，再製作整頁視覺</text><text x="190" y="775" font-size="24" fill="#334155" font-weight="400">圖像式 PPTX、PDF 簡報：整頁文字無法直接編輯</text><rect x="44" y="844" width="872" height="130" rx="20" fill="#e3f4ef" stroke="#9bcdbf"/><text x="72" y="888" font-size="29" fill="#0f766e" font-weight="700">要修改？先回到可編輯母檔</text><text x="72" y="928" font-size="25" fill="#334155" font-weight="400">修好文字或配圖，再重新製作對應的圖像頁。</text><text x="44" y="1025" font-size="27" fill="#123b64" font-weight="700">完成後：核對頁面 → 開啟簡報 → 下載 PPTX</text><text x="44" y="1070" font-size="24" fill="#334155" font-weight="400">風格與圖片版本存入自己的 Google Drive，供下次使用。</text></g></svg>
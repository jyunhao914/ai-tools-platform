<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>私人後台登入</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:16px/1.6 system-ui}main{max-width:430px;margin:12vh auto;padding:30px;background:#1f2937;border-radius:16px}h1{font-size:25px}label{display:block}input,button{width:100%;padding:13px;border-radius:8px;border:1px solid #64748b;margin:8px 0 16px;font:inherit}button{background:#2563eb;color:white;cursor:pointer}a{color:#93c5fd}#message{color:#fca5a5}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111827}#historyRows article{border-top:1px solid #526174;padding:12px 0;overflow-wrap:anywhere}#historyRows dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:.5em 0}#historyRows dd{margin:0}#historyRows dt{color:#cbd5e1}</style></head><body><main id="login"><h1>私人後台登入</h1><p>輸入帳號與密碼即可管理網站。</p><form id="form"><label for="username">帳號</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="password">管理密碼</label><input id="password" type="password" autocomplete="current-password" required><label style="display:flex;align-items:center;gap:8px;margin:0 0 12px"><input id="showPassword" type="checkbox" style="width:auto;margin:0">顯示密碼</label><button id="submit">登入</button></form><p id="message" role="status"></p><section id="codes" hidden><h2>高解析原樣重建 · 下載授權</h2><p>每位收件人一組密碼，核發後 24 小時到期。可兌換一個限用一次的下載網址。</p>
<form id="emailGrant"><label for="recipient">收件人 Email</label><input id="recipient" type="email" required maxlength="254" autocomplete="off" autocapitalize="none" spellcheck="false"><button>產生密碼並寄信</button></form>
<small>由 zxc80057@gmail.com 寄出下載密碼、領取網址與到期時間。</small>
<button id="issue" type="button">只產生密碼（自行轉交）</button><label for="grant">下載密碼（可複製或貼上以撤銷）</label><input id="grant" autocomplete="off" spellcheck="false">
<button id="revoke" type="button">撤銷這組授權</button><p id="grantStatus" role="status"></p><a href="assets/reconstruction-access.html" target="_blank" rel="noopener">訪客領取頁</a> · <a href="manage.html">返回後台登入</a>
<h2>授權紀錄</h2><p>時間均為台灣時間。「已下載」表示伺服器已核銷資格並交付檔案。</p>
<button type="button" id="historyRefresh">重新整理紀錄</button><p id="historyStatus" role="status"></p><div id="historyRows"></div><button type="button" id="historyMore" hidden>載入更多</button></section>
<p id="codesLink"><a href="manage.html#download-codes">管理一次性下載密碼</a></p><a href="./">返回公開網站</a></main><script>
const API='https://script.google.com/macros/s/AKfycbx6qfQFbhAwiqA4AdRisH2HuZDw8iLQEEw-pxraTYCCoMInj0O9cpygBSsB6ii32j21/exec';
document.getElementById('showPassword').onchange=function(){document.getElementById('password').type=this.checked?'text':'password';};
let session='',frame=null,expiry=null,mainHtml='';
async function api(action,params={}){const r=await fetch(API,{method:'POST',body:new URLSearchParams({action,...params}),credentials:'omit',referrerPolicy:'no-referrer'});return await r.json();}
function show(html){if(frame)frame.remove();frame=document.createElement('iframe');frame.title='私人網站管理';frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads');frame.srcdoc=html;document.body.appendChild(frame);document.getElementById('login').hidden=true;}
function end(message){++historyRequest;document.getElementById('historyRows').replaceChildren();document.getElementById('historyStatus').textContent='';document.getElementById('historyMore').hidden=true;emailAttempt=null;document.getElementById('recipient').value='';document.getElementById('grantStatus').textContent='';const old=session;session='';document.getElementById('codes').hidden=true;document.getElementById('codesLink').hidden=false;document.getElementById('form').hidden=false;document.getElementById('grant').value='';mainHtml='';clearTimeout(expiry);if(frame)frame.remove();frame=null;document.getElementById('login').hidden=false;document.getElementById('message').textContent=message||'已登出';if(old)api('remoteLogout',{session:old}).catch(()=>{});}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),input=document.getElementById('password');b.disabled=true;document.getElementById('message').textContent='驗證中…';const pw=input.value;input.value='';try{const j=await api('remoteLogin',{pw,username:document.getElementById('username').value.trim()});if(!j.ok)throw Error(j.error);session=j.session;mainHtml=j.html;if(location.hash==='#download-codes'){document.getElementById('form').hidden=true;document.getElementById('codesLink').hidden=true;document.getElementById('codes').hidden=false;loadHistory();document.getElementById('message').textContent='';}else show(j.html);expiry=setTimeout(()=>end('登入已逾時，請重新輸入密碼。'),j.expiresIn*1000);}catch(err){document.getElementById('message').textContent=err.message||'連線失敗，請稍後重試';}finally{b.disabled=false;}};
if(location.hash==='#download-codes')document.querySelector('#login h1').textContent='下載授權管理登入';
function newGrantCode(){return btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(32)))).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'');}
async function changeGrant(issue){
  const status=document.getElementById('grantStatus'),input=document.getElementById('grant');
  const code=issue?newGrantCode():input.value.trim();
  const buttons=document.querySelectorAll('#codes button');buttons.forEach(b=>b.disabled=true);
  try{
    const result=await api(issue?'remoteIssueDownload':'remoteRevokeDownload',{session,code});
    if(result.error==='session_expired'){end('登入已逾時，請重新登入。');return;}
    if(!result.ok)throw Error(result.error==='invalid'?'找不到有效授權。':'無法更新授權，請稍後再試。');
    input.value=issue?code:'';
    status.textContent=issue?'請私下將密碼交給收件人。到期時間 '+new Date(result.until).toLocaleString('zh-TW'):'已撤銷密碼及其臨時網址。';
    if(issue){input.focus();input.select();}loadHistory();
  }catch(error){status.textContent=error.message;}finally{buttons.forEach(b=>b.disabled=false);}
}
let historyRequest=0;
async function loadHistory(append=false){
  const request=++historyRequest,rows=document.getElementById('historyRows'),more=document.getElementById('historyMore'),status=document.getElementById('historyStatus');
  more.hidden=true;status.textContent='正在讀取紀錄…';
  try{
    const result=await api('remoteDownloadHistory',{session,offset:append?rows.childElementCount:0});
    if(request!==historyRequest)return;
    if(result.error==='session_expired'){end('登入已逾時，請重新登入。');return;}
    if(!result.ok)throw Error();
    if(!append)rows.replaceChildren();
    for(const record of result.rows){
      const article=document.createElement('article'),title=document.createElement('strong'),details=document.createElement('dl');
      title.textContent=record.recipient+' · '+record.status;
      for(const [label,when] of [['核發',record.issuedAt],['兌換',record.redeemedAt],['下載',record.downloadedAt],['撤銷',record.revokedAt],['到期',record.until]]){
        if(!when && label==='撤銷')continue;
        const term=document.createElement('dt'),value=document.createElement('dd');term.textContent=label;value.textContent=when?new Date(when).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'—';
        details.append(term,value);
      }
      article.append(title,details);rows.append(article);
    }
    status.textContent=result.total?'已顯示 '+rows.childElementCount+' / '+result.total+' 筆':'目前沒有授權紀錄。';
    more.hidden=rows.childElementCount>=result.total;
  }catch(error){if(request===historyRequest)status.textContent='紀錄讀取失敗，請按重新整理。';}
}
document.getElementById('historyRefresh').onclick=()=>loadHistory();
document.getElementById('historyMore').onclick=()=>loadHistory(true);
let emailAttempt=null;
document.getElementById('emailGrant').onsubmit=async e=>{
  e.preventDefault();
  const address=document.getElementById('recipient'),email=address.value.trim();
  const status=document.getElementById('grantStatus'),grant=document.getElementById('grant');
  const controls=document.querySelectorAll('#codes button,#recipient');controls.forEach(el=>el.disabled=true);
  if(!emailAttempt||emailAttempt.email!==email)emailAttempt={email,code:newGrantCode()};
  const code=emailAttempt.code;
  grant.value=code;status.textContent='正在核發密碼並寄信…';
  try{
    const result=await api('remoteEmailDownload',{session,email,code});
    if(result.error==='session_expired'){end('登入已逾時，請重新登入。');return;}
    const errors={invalid_email:'請輸入單一有效的收件人 Email。',mail_quota:'今日寄信額度已用完。',mail_failed:'未能寄信，請稍後重試。',mail_uncertain:'無法確認寄送結果。請先查寄件紀錄，必要時撤銷這組密碼。',inactive:'這組授權已使用或撤銷，請重新發放。'};
    if(result.error==='inactive')emailAttempt=null;
    if(!result.ok)throw Error(errors[result.error]||'暫時無法確認寄送結果，請稍後用相同信箱重試。');
    status.textContent='已寄給 '+email+'。到期時間 '+new Date(result.until).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'（台灣時間）。';
    emailAttempt=null;address.value='';loadHistory();
  }catch(error){status.textContent=error.message;}finally{controls.forEach(el=>el.disabled=false);}
};
document.getElementById('issue').onclick=()=>changeGrant(true);
document.getElementById('revoke').onclick=()=>changeGrant(false);
addEventListener('message',async e=>{if(!frame||e.source!==frame.contentWindow||!e.data||!e.data.privateAdmin)return;const m=e.data,source=e.source;try{let j;if(m.kind==='stop'){source.postMessage({privateAdmin:true,id:m.id,result:{ok:true}},'*');end();return;}if(m.kind==='home'){show(mainHtml);return;}if(m.kind==='hub'){j=await api('remoteHub',{session,hub:m.payload.hub});if(j.ok){show(j.html);return;}}else if(m.kind==='github'||m.kind==='gas'){j=await api(m.kind==='github'?'remoteGithub':'remoteCloud',{session,payload:JSON.stringify(m.payload)});}else throw Error('不允許的操作');if(j.error==='session_expired'){end('登入已逾時，請重新輸入密碼。');return;}if(j.ok===false)throw Error(j.error||'操作失敗');source.postMessage({privateAdmin:true,id:m.id,result:j},'*');}catch(err){source.postMessage({privateAdmin:true,id:m.id,error:err.message||'連線失敗'},'*');}});
</script></body></html>

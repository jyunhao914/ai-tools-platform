<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>私人後台登入</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:16px/1.6 system-ui}main{max-width:430px;margin:12vh auto;padding:30px;background:#1f2937;border-radius:16px}h1{font-size:25px}label{display:block}input,button{width:100%;padding:13px;border-radius:8px;border:1px solid #64748b;margin:8px 0 16px;font:inherit}button{background:#2563eb;color:white;cursor:pointer}a{color:#93c5fd}#message{color:#fca5a5}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111827}</style></head><body><main id="login"><h1>私人後台登入</h1><p>輸入帳號與密碼即可管理網站。</p><form id="form"><label for="username">帳號</label><input id="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required><label for="password">管理密碼</label><input id="password" type="password" autocomplete="current-password" required><label style="display:flex;align-items:center;gap:8px;margin:0 0 12px"><input id="showPassword" type="checkbox" style="width:auto;margin:0">顯示密碼</label><button id="submit">登入</button></form><p id="message" role="status"></p><a href="./">返回公開網站</a></main><script>
const API='https://script.google.com/macros/s/AKfycbx6qfQFbhAwiqA4AdRisH2HuZDw8iLQEEw-pxraTYCCoMInj0O9cpygBSsB6ii32j21/exec';
document.getElementById('showPassword').onchange=function(){document.getElementById('password').type=this.checked?'text':'password';};
let session='',frame=null,expiry=null,mainHtml='';
async function api(action,params={}){const r=await fetch(API,{method:'POST',body:new URLSearchParams({action,...params}),credentials:'omit',referrerPolicy:'no-referrer'});return await r.json();}
function show(html){if(frame)frame.remove();frame=document.createElement('iframe');frame.title='私人網站管理';frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads');frame.srcdoc=html;document.body.appendChild(frame);document.getElementById('login').hidden=true;}
function end(message){const old=session;session='';mainHtml='';clearTimeout(expiry);if(frame)frame.remove();frame=null;document.getElementById('login').hidden=false;document.getElementById('message').textContent=message||'已登出';if(old)api('remoteLogout',{session:old}).catch(()=>{});}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),input=document.getElementById('password');b.disabled=true;document.getElementById('message').textContent='驗證中…';const pw=input.value;input.value='';try{const j=await api('remoteLogin',{pw,username:document.getElementById('username').value.trim()});if(!j.ok)throw Error(j.error);session=j.session;mainHtml=j.html;show(j.html);expiry=setTimeout(()=>end('登入已逾時，請重新輸入密碼。'),j.expiresIn*1000);}catch(err){document.getElementById('message').textContent=err.message||'連線失敗，請稍後重試';}finally{b.disabled=false;}};
addEventListener('message',async e=>{if(!frame||e.source!==frame.contentWindow||!e.data||!e.data.privateAdmin)return;const m=e.data,source=e.source;try{let j;if(m.kind==='stop'){source.postMessage({privateAdmin:true,id:m.id,result:{ok:true}},'*');end();return;}if(m.kind==='home'){show(mainHtml);return;}if(m.kind==='hub'){j=await api('remoteHub',{session,hub:m.payload.hub});if(j.ok){show(j.html);return;}}else if(m.kind==='github'||m.kind==='gas'){j=await api(m.kind==='github'?'remoteGithub':'remoteCloud',{session,payload:JSON.stringify(m.payload)});}else throw Error('不允許的操作');if(j.error==='session_expired'){end('登入已逾時，請重新輸入密碼。');return;}if(j.ok===false)throw Error(j.error||'操作失敗');source.postMessage({privateAdmin:true,id:m.id,result:j},'*');}catch(err){source.postMessage({privateAdmin:true,id:m.id,error:err.message||'連線失敗'},'*');}});
</script></body></html>
